<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafetyMA — WebR Peto Odds Ratio Calculator</title>
    <script src="https://webr.r-wasm.org/latest/webr.js"></script>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #ef4444; --border: #334155;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); }
        h1 { color: var(--accent); margin-bottom: 0.5rem; }
        .desc { color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }
        .loader { font-style: italic; color: #3b82f6; margin-bottom: 1rem; }
        textarea { width: 100%; height: 150px; background: #0f172a; color: #10b981; border: 1px solid var(--border); padding: 1rem; font-family: monospace; border-radius: 8px; margin-bottom: 1rem; }
        .btn { background: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        pre { background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; color: #f8fafc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SafetyMA: Rare Events Synthesizer</h1>
        <p class="desc">Serverless calculation of Peto Odds Ratios using WebAssembly R (WebR). Ideal for pharmacovigilance and rare-event meta-analyses.</p>
        
        <div id="status" class="loader">Loading WebR engine...</div>

        <label>Input Trial Data (Trial, Treat Events, Treat Total, Ctrl Events, Ctrl Total):</label>
        <textarea id="dataInput">Trial1, 1, 100, 0, 100
Trial2, 0, 150, 2, 150
Trial3, 2, 200, 1, 200
Trial4, 0, 50, 0, 50</textarea>
        
        <button id="calcBtn" class="btn" disabled onclick="runPeto()">Calculate Peto OR (R metafor)</button>
        
        <h3 style="margin-top: 2rem;">R Console Output:</h3>
        <pre id="output">Results will appear here...</pre>
    </div>

    <script type="module">
        import { WebR } from 'https://webr.r-wasm.org/latest/webr.mjs';
        
        const webr = new WebR();
        await webr.init();
        
        document.getElementById('status').innerText = 'WebR initialized. Downloading metafor package...';
        await webr.evalRVoid(`install.packages("metafor", repos="https://repo.r-wasm.org")`);
        
        document.getElementById('status').innerText = 'System Ready.';
        document.getElementById('status').style.color = '#10b981';
        document.getElementById('calcBtn').disabled = false;

        window.runPeto = async function() {
            const rawData = document.getElementById('dataInput').value;
            const output = document.getElementById('output');
            output.innerText = "Processing...";
            
            // Format data for R
            const lines = rawData.split('\\n').filter(l => l.trim().length > 0);
            const tE = [], tN = [], cE = [], cN = [];
            
            lines.forEach(line => {
                const parts = line.split(',');
                if(parts.length >= 5) {
                    tE.push(parts[1].trim());
                    tN.push(parts[2].trim());
                    cE.push(parts[3].trim());
                    cN.push(parts[4].trim());
                }
            });

            const rScript = `
library(metafor)
tE <- c(${tE.join(',')})
tN <- c(${tN.join(',')})
cE <- c(${cE.join(',')})
cN <- c(${cN.join(',')})

# Peto's method is ideal for rare events with sparse data
res <- rma.peto(ai=tE, n1i=tN, ci=cE, n2i=cN)
capture.output(print(res))
            `;

            try {
                const result = await webr.evalR(rScript);
                const resultStr = await result.toArray();
                output.innerText = resultStr.join('\\n');
            } catch (err) {
                output.innerText = "Error running R script: " + err;
            }
        }
    </script>
</body>
</html>
